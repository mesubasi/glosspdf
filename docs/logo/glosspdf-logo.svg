<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="GlossPDF">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a4d"/>
      <stop offset="1" stop-color="#bd1319"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f2f6"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9da"/>
      <stop offset="1" stop-color="#f4a3a6"/>
    </linearGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="224"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#5b0306" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <!-- gloss sweep -->
  <g clip-path="url(#tile)">
    <path d="M64 64H960V400C760 500 330 520 64 400Z" fill="url(#gloss)"/>
  </g>

  <!-- page with folded corner -->
  <g filter="url(#drop)">
    <path d="M338 206H578L728 356V776A40 40 0 0 1 688 816H338A40 40 0 0 1 298 776V246A40 40 0 0 1 338 206Z" fill="url(#page)"/>
  </g>
  <path d="M578 206V326A30 30 0 0 0 608 356H728Z" fill="url(#fold)"/>

  <!-- text lines with a highlighter stroke -->
  <rect x="338" y="396" width="300" height="52" rx="12" fill="#ffd60a" opacity=".85"/>
  <rect x="352" y="300" width="200" height="26" rx="13" fill="#3a3f4b"/>
  <rect x="352" y="410" width="270" height="26" rx="13" fill="#3a3f4b"/>
  <rect x="352" y="356" width="150" height="26" rx="13" fill="#3a3f4b" opacity=".45"/>

  <!-- signature -->
  <g fill="none" stroke="#d81e24" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 650C384 566 420 556 424 614C428 676 460 700 488 626C504 584 530 582 540 628C548 662 580 668 640 604"/>
    <path d="M352 724H654" stroke-width="14" opacity=".55"/>
  </g>
</svg>
